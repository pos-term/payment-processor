name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-checks:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      kafka:
        image: apache/kafka:4.0.0
        ports:
          - "127.0.0.1:9094:9094"
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENERS: PLAINTEXT://:9094,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9094
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9094"
          --health-start-period 20s
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12
      postgres:
        image: postgres:16-alpine
        ports:
          - "127.0.0.1:5432:5432"
        env:
          POSTGRES_DB: pos
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U pos -d pos"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - "127.0.0.1:6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Run tests with service containers
        env:
          TEST_KAFKA_BROKERS: 127.0.0.1:9094
          TEST_POSTGRES_DSN: postgres://pos:pos@127.0.0.1:5432/pos?sslmode=disable
          TEST_REDIS_ADDR: 127.0.0.1:6379
        run: |
          go test -race -count=1 -v ./... | tee "$RUNNER_TEMP/go-test.log"
          if grep -Eq '^[[:space:]]*--- SKIP: Test' "$RUNNER_TEMP/go-test.log"; then
            echo "::error::The full test suite must run without skips in CI."
            exit 1
          fi
